spring.application.name=backend

# ---- Database ----
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smart_ai_hms}

# ---- Security ----
# For real use, set JWT_SECRET as an environment variable (at least 32 characters).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789-abcdef}
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# ---- First admin account (created only if no admin exists) ----
app.admin.name=${ADMIN_NAME:System Admin}
app.admin.email=${ADMIN_EMAIL:admin@hms.local}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
